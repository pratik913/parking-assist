spring:
  application:
    name: parking-assist
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/parking_assist}
    username: ${DATABASE_USERNAME:parking}
    password: ${DATABASE_PASSWORD:parking_local_only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true
app:
  security.jwt-secret: ${APP_JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  geocoding.google-api-key: ${GOOGLE_MAPS_GEOCODING_API_KEY:}
  booking.expiry-scan-ms: ${BOOKING_EXPIRY_SCAN_MS:15000}
springdoc.swagger-ui.path: /swagger-ui.html